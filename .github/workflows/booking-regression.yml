name: Booking regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  booking-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CelebBackend-main
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
